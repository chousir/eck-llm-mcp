---
# Environment-specific values live here (higher precedence than role defaults); other tunables and internal constants are in
# roles/kubectl/eck-llm-mcp/defaults/main.yml.
# Note: the inventory host name (k8s-controller01 in hosts.yaml) must equal the k8s node name
# (the NAME column of kubectl get nodes): templates use it for nodeSelector and the local PV node affinity.

# Models: extract ollama-models.tar into the Ollama PV yourself (README section 1); the playbook only checks they are there.
# name:tag; must match package/models.list. The primary and embedding models must both be in this list.
# Add the fallback qwen3-coder:30b only if it was packaged.
ollama_models:
  - qwen3.6:35b
  - bge-m3:latest
ollama_primary_model: "{{ ollama_models[0] }}"       # default model, target of the tool_calls check, base of the assistant model
ollama_embed_model: "{{ ollama_models[1] }}"       # RAG embedding model

# Images: original names, pulled directly by the nodes (no registry prefix)
ollama_image: ollama/ollama:0.32.9
open_webui_image: ghcr.io/open-webui/open-webui:v0.11.0
es_mcp_image: docker.elastic.co/mcp/elasticsearch:0.4.6
nginx_image: nginx:1.23.0-alpine

open_webui_vip: ""             # empty = let MetalLB assign; set it to pin the IP

# Indices the es-mcp read-only user may read; narrow it to the patterns you really query, e.g. ["netflow-*"]
mcp_index_patterns: ["*"]

ollama_pv_path: /var/lib/ai/ollama
openwebui_pv_path: /var/lib/ai/openwebui
ollama_models_dir: "{{ ollama_pv_path }}/models"
