---
# Environment assumptions (kubespray, single cluster, MetalLB, cert-manager ca-issuer) are hardcoded in templates and tasks; see the README (environment assumptions section).
# Models, images, model tar path and VIP are in inventory/group_vars/all.yml; put overrides for other variables there too.

# The existing ECK Elasticsearch resource (the stack, not the operator). Look it up with: kubectl get elasticsearch -A
eck_es_name: prod
eck_namespace: elastic-stack

# Indices the es-mcp read-only user may read; narrow it to the patterns you really query, e.g. ["netflow-*"]
mcp_index_patterns: ["*"]

# ---- Ollama (CPU inference; see the README tuning section) ----
ollama_context_length: 32768   # too small truncates the tool definitions and the model stops calling tools
ollama_num_thread: 32          # inference threads; the controller also runs etcd/apiserver, so keep this below the core count
ollama_memory_limit: 128Gi

# ---- Open WebUI HTTPS ----
cert_issuer_name: ca-issuer    # CA-type ClusterIssuer

# Internal constants (fixed by the environment, no need to change)
ai_namespace: ai
manifest_dir: /etc/k8s/eck-llm-mcp

ollama_pv_path: /var/lib/ai/ollama
openwebui_pv_path: /var/lib/ai/openwebui
ollama_models_dir: "{{ ollama_pv_path }}/models"
ollama_primary_model: "{{ ollama_models[0] }}"
ollama_embed_model: nomic-embed-text:latest

ollama_url: "http://ollama.{{ ai_namespace }}.svc:11434"
es_mcp_url: "http://es-mcp.{{ ai_namespace }}.svc:8080/mcp"
# ECK naming convention: <name>-es-http, <name>-es-elastic-user; ES enables TLS (self-signed) by default
es_url: "https://{{ eck_es_name }}-es-http.{{ eck_namespace }}.svc:9200"
es_admin_secret: "{{ eck_es_name }}-es-elastic-user"

# Written to the Open WebUI DB on first start (change it later under Admin -> Settings -> Integrations)
# an empty access_grants means admin only; here it is opened read-only to every signed-in user
webui_tool_server_connections:
  - type: mcp
    url: "{{ es_mcp_url }}"
    path: ""
    auth_type: none
    key: ""
    config:
      enable: true
      access_grants:
        - { principal_type: user, principal_id: "*", permission: read }
    info:
      id: es-mcp
      name: Elasticsearch
      description: "Elasticsearch read-only tools: list_indices / get_mappings / search / esql / get_shards"
webui_default_model_params:
  function_calling: native
  num_thread: "{{ ollama_num_thread | int }}"
