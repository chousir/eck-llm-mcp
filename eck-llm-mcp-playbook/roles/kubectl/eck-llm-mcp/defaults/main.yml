---
# =====================================================================
# kubectl 執行方式
# =====================================================================
# k8s-controller01 本機即 controller，kubectl 直接在該機以 root(become) 執行。
# kubeadm 佈署的 controller 常見預設路徑；若實際不同請覆寫此變數。
kubectl_kubeconfig: /etc/kubernetes/admin.conf

# =====================================================================
# Namespace / node 排程
# =====================================================================
ai_namespace: ai
ai_node_name: k8s-controller01
ai_node_label_key: ai-workload
ai_node_label_value: "true"

# =====================================================================
# 本地儲存（controller 本地 PV）
# =====================================================================
local_pv_base_dir: /var/lib/ai
ollama_pv_path: "{{ local_pv_base_dir }}/ollama"
openwebui_pv_path: "{{ local_pv_base_dir }}/openwebui"
ollama_pv_capacity: 60Gi
openwebui_pv_capacity: 10Gi

# kubectl apply 用的 rendered manifest 存放目錄（純供紀錄/除錯，非必要但方便追查）
manifest_dir: "{{ local_pv_base_dir }}/manifests"

# =====================================================================
# 模型 staging（LLM_MCP/models/.ollama_staging）
# =====================================================================
# TODO: 確認遠端主機上 LLM_MCP 的實際基底路徑
llm_mcp_base_dir: /home/user/eck-llm-mcp/LLM_MCP
ollama_staging_dir: "{{ llm_mcp_base_dir }}/models/.ollama_staging"

# 主力模型：唯一預期需要調整的就是這個 tag（例如換量化版本時）
ollama_primary_model_name: qwen3.6
ollama_primary_model_tag: "35b"

# 嵌入模型（RAG 用）
ollama_embed_model_name: nomic-embed-text
ollama_embed_model_tag: latest

# =====================================================================
# Image 參照（映像已由使用者自行 pull + push 到內部 registry）
# TODO: 確認以下三個路徑/tag 與實際 push 上去的完全一致，否則 ImagePullBackOff
# =====================================================================
ollama_image: registry.internal:5000/ollama/ollama:0.32.9
open_webui_image: registry.internal:5000/open-webui/open-webui:v0.11.0
es_mcp_image: registry.internal:5000/mcp/elasticsearch:0.4.6

# =====================================================================
# Ollama
# =====================================================================
ollama_service_port: 11434
ollama_keep_alive: "24h"
ollama_num_parallel: "2"
ollama_resources_requests_memory: 32Gi
ollama_resources_requests_cpu: "8"
ollama_resources_limits_memory: 48Gi

# =====================================================================
# es-mcp（Elasticsearch MCP Server）
# =====================================================================
es_mcp_service_port: 8080
# 叢集內部可解析（pod 網路），與下面的 es_public_url 是兩個不同用途的位址
es_mcp_es_url: "https://prod-es-http.elastic-stack.svc:9200"
es_mcp_es_username: mcp_user
es_mcp_es_ssl_skip_verify: "true"
es_mcp_resources_requests_memory: 256Mi
es_mcp_resources_requests_cpu: 200m
es_mcp_resources_limits_memory: 512Mi

# =====================================================================
# Open WebUI
# =====================================================================
open_webui_service_port: 8080
open_webui_service_type: LoadBalancer
# 規劃書 §5.2 兩階段 bootstrap：先 true 建 admin/使用者，之後改成 "false" 再重跑
webui_enable_signup: "true"
open_webui_resources_requests_memory: 2Gi
open_webui_resources_requests_cpu: "1"
open_webui_resources_limits_memory: 4Gi

# =====================================================================
# ES 唯讀帳號建立（es_security.yml，可用 --skip-tags es_security 略過）
# =====================================================================
# 既有 ECK elastic 超級使用者 Secret（使用者標記為推測值，需確認）
es_admin_secret_name: prod-es-elastic-user
es_admin_secret_namespace: elastic-stack
es_admin_secret_key: elastic

# TODO: 改成實際可從 k8s-controller01 主機連到的 ES VIP / hostname
# （es-mcp 容器內用的是叢集內部 DNS，主機本身不一定能解析，故另立此變數）
es_public_url: "https://CHANGEME-es-vip:9200"

mcp_role_name: mcp_readonly
mcp_user_name: mcp_user
