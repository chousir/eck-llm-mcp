---
# 環境假設（kubespray、單一 cluster、MetalLB、cert-manager 的 ca-issuer）寫死在 vars/main.yml 與模板裡，
# 見 README「環境假設」。這裡只放可能要改的值；覆寫請寫到 inventory/group_vars/all.yml。

# AI 元件要跑的節點（kubectl get nodes 的 NAME），必須就是 ansible 目標主機：模型與本地 PV 都在這台。
ai_node_name: k8s-controller01

# 模型 tar（package/pull.sh 產生的 ollama-models.tar），只有 PV 上缺模型時才會讀取。
ollama_models_src: /opt/eck-llm-mcp/ollama-models.tar
# name:tag；第一個是主力模型（預設模型、tool_calls 驗證對象），需與 package/models.list 對應
ollama_models:
  - qwen3.6:35b
  - nomic-embed-text:latest
  # - qwen3-coder:30b      # 規劃書 §4.4 備援；有打包才打開

# 既有 ECK 的 Elasticsearch 資源（stack，不是 operator）。查法：kubectl get elasticsearch -A
eck_es_name: prod
eck_namespace: elastic-stack

# es-mcp 唯讀帳號可讀的 index；建議收斂成實際要查的 pattern，例如 ["netflow-*"]
mcp_index_patterns: ["*"]

# 映像：原始名稱，節點直接 pull（不加 registry 位址）
ollama_image: ollama/ollama:0.32.9
open_webui_image: ghcr.io/open-webui/open-webui:v0.11.0
es_mcp_image: docker.elastic.co/mcp/elasticsearch:0.4.6
nginx_image: nginx:1.30-alpine

# ---- Ollama（CPU 推論；調校方式見 README「調校」）----
ollama_context_length: 32768   # 太小會截掉工具定義，模型就不呼叫工具
ollama_num_thread: 32          # 推論執行緒數；controller 兼跑 etcd/apiserver，要比核心數少
ollama_memory_limit: 128Gi

# ---- Open WebUI HTTPS ----
cert_issuer_name: ca-issuer    # CA 型 ClusterIssuer
open_webui_vip: ""             # 空＝MetalLB 自動配發；要固定 IP 時填
