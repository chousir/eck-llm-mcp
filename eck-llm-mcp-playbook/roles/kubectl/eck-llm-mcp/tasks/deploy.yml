---
# Order: Ollama + es-mcp -> Service (get the MetalLB IP) -> Certificate (SAN = IP) -> Open WebUI
# If any step times out, the rescue lists pods and events (common in offline setups: ImagePullBackOff, Pending).
- name: 部署並等待就緒
  block:
    - name: Render ollama-and-es-mcp.yaml 與 webui-loadbalancer-svc.yaml
      template:
        src: "{{ item }}.j2"
        dest: "{{ manifest_dir }}/{{ item }}"
        mode: "0644"
      loop: [ollama-and-es-mcp.yaml, webui-loadbalancer-svc.yaml]

    - name: Apply ollama-and-es-mcp.yaml 與 webui-loadbalancer-svc.yaml
      command: "kubectl apply -f {{ manifest_dir }}/{{ item }}"
      register: apply_result
      changed_when: apply_result.stdout is search('created|configured')
      loop: [ollama-and-es-mcp.yaml, webui-loadbalancer-svc.yaml]

    - name: 等待 ollama、es-mcp rollout
      command: "kubectl -n {{ ai_namespace }} rollout status deploy/{{ item }} --timeout=600s"
      changed_when: false
      loop: [ollama, es-mcp]

    - name: 等待 MetalLB 配發 open-webui 的 IP
      command: "kubectl -n {{ ai_namespace }} get svc open-webui -o jsonpath={.status.loadBalancer.ingress[0].ip}"
      register: webui_svc_ip
      changed_when: false
      until: webui_svc_ip.stdout | length > 0
      retries: 12
      delay: 5

    - name: 記錄 open-webui IP
      set_fact:
        webui_vip: "{{ webui_svc_ip.stdout }}"

    - name: Render webui-tls-deployment.yaml
      template:
        src: webui-tls-deployment.yaml.j2
        dest: "{{ manifest_dir }}/webui-tls-deployment.yaml"
        mode: "0644"

    - name: Apply webui-tls-deployment.yaml（Certificate + nginx 設定 + Deployment）
      command: "kubectl apply -f {{ manifest_dir }}/webui-tls-deployment.yaml"
      register: apply_result
      changed_when: apply_result.stdout is search('created|configured')

    - name: 等待憑證由 {{ cert_issuer_name }} 簽發
      command: "kubectl -n {{ ai_namespace }} wait --for=condition=Ready certificate/open-webui-tls --timeout=120s"
      changed_when: false

    - name: 等待 open-webui rollout
      command: "kubectl -n {{ ai_namespace }} rollout status deploy/open-webui --timeout=600s"
      changed_when: false
  rescue:
    - name: 收集診斷資訊
      shell: |
        kubectl -n {{ ai_namespace }} get pods -o wide
        echo '--- events ---'
        kubectl -n {{ ai_namespace }} get events --sort-by=.lastTimestamp | tail -25
      register: deploy_diag
      changed_when: false
      failed_when: false

    - name: 部署失敗
      fail:
        msg: |
          部署未在時限內完成。目前狀態：
          {{ deploy_diag.stdout | default('') }}
