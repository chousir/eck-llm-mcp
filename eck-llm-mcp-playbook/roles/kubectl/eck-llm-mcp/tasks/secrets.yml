---
# 兩個 Secret 都用「先讀、讀不到才產生」模式，確保重跑安全，
# 且 mcp_user 在 k8s Secret 與 ES 端的密碼永遠一致（es_security.yml 會用同一個值）。

- name: 檢查 open-webui-secret 是否已存在
  command: >
    kubectl -n {{ ai_namespace }} get secret open-webui-secret
    -o jsonpath={.data.WEBUI_SECRET_KEY}
  environment:
    KUBECONFIG: "{{ kubectl_kubeconfig }}"
  register: webui_secret_lookup
  failed_when: false
  changed_when: false

- name: 產生並建立 open-webui-secret（僅在不存在時）
  command: >
    kubectl -n {{ ai_namespace }} create secret generic open-webui-secret
    --from-literal=WEBUI_SECRET_KEY={{ lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}
  environment:
    KUBECONFIG: "{{ kubectl_kubeconfig }}"
  when: webui_secret_lookup.stdout | default('') | length == 0
  no_log: true
  notify: restart open-webui deployment

- name: 檢查 es-mcp-cred 是否已存在
  command: >
    kubectl -n {{ ai_namespace }} get secret es-mcp-cred
    -o jsonpath={.data.password}
  environment:
    KUBECONFIG: "{{ kubectl_kubeconfig }}"
  register: es_mcp_cred_lookup
  failed_when: false
  changed_when: false
  no_log: true

- name: 產生 mcp_user 密碼（僅在 es-mcp-cred 尚未存在時）
  set_fact:
    mcp_user_password: "{{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}"
  when: es_mcp_cred_lookup.stdout | default('') | length == 0
  no_log: true

- name: 讀回既有 es-mcp-cred 密碼（供 ES 端保持一致）
  set_fact:
    mcp_user_password: "{{ es_mcp_cred_lookup.stdout | b64decode }}"
  when: es_mcp_cred_lookup.stdout | default('') | length > 0
  no_log: true

- name: 建立 es-mcp-cred（僅在不存在時）
  command: >
    kubectl -n {{ ai_namespace }} create secret generic es-mcp-cred
    --from-literal=password={{ mcp_user_password }}
  environment:
    KUBECONFIG: "{{ kubectl_kubeconfig }}"
  when: es_mcp_cred_lookup.stdout | default('') | length == 0
  no_log: true
  notify: restart es-mcp deployment
