---
# 「先讀、讀不到才產生」：重跑不會換密碼，且 mcp_user 在 k8s Secret 與 ES 端永遠一致
# （es_security.yml 用同一個 mcp_user_password）。
# 這段標 tags: always（見 main.yml），所以單獨跑 --tags es_security / verify 時變數一定存在。
# Secret 內容（stdin 傳給 kubectl）不落地；值變動時由 Deployment 的 checksum annotation 觸發 rollout。

- name: 讀取既有 Secret（不存在則為空）
  command: "{{ kubectl_cmd }} -n {{ ai_namespace }} get secret {{ item }} -o json --ignore-not-found"
  register: secret_lookup
  loop: [open-webui-secret, es-mcp-cred]
  changed_when: false
  no_log: true

- name: 解析既有 Secret 內容
  vars:
    webui_data: >-
      {{ (secret_lookup.results[0].stdout | from_json).data | default({})
         if secret_lookup.results[0].stdout | length > 0 else {} }}
    cred_data: >-
      {{ (secret_lookup.results[1].stdout | from_json).data | default({})
         if secret_lookup.results[1].stdout | length > 0 else {} }}
  set_fact:
    webui_secret_key: >-
      {{ (webui_data.WEBUI_SECRET_KEY | b64decode) if webui_data.WEBUI_SECRET_KEY is defined
         else lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}
    webui_admin_password_resolved: >-
      {{ webui_admin_password if webui_admin_password | length > 0
         else (webui_data.WEBUI_ADMIN_PASSWORD | b64decode) if webui_data.WEBUI_ADMIN_PASSWORD is defined
         else lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}
    mcp_user_password: >-
      {{ (cred_data.password | b64decode) if cred_data.password is defined
         else lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}
  no_log: true

- name: 建立/更新 open-webui-secret 與 es-mcp-cred
  command: "{{ kubectl_cmd }} apply -f -"
  args:
    stdin: "{{ lookup('template', 'secrets.yaml.j2') }}"
  register: secrets_apply
  changed_when: secrets_apply.stdout is search('(created|configured)')
  no_log: true
