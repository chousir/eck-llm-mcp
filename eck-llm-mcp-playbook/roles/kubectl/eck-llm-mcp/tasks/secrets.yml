---
# 「不存在才建」：重跑不會換密碼，mcp_user 在 k8s Secret 與 ES 端永遠一致（es_security.yml 從 Secret 讀）。
- name: 檢查 Secret 是否已存在
  command: "{{ kubectl_cmd }} -n {{ ai_namespace }} get secret {{ item }} --ignore-not-found -o name"
  register: secret_exists
  loop: [open-webui-secret, es-mcp-cred]
  changed_when: false

- name: 建立 open-webui-secret（session 金鑰 + admin 密碼）
  command: >-
    {{ kubectl_cmd }} -n {{ ai_namespace }} create secret generic open-webui-secret
    --from-literal=WEBUI_SECRET_KEY={{ lookup('password', '/dev/null length=64 chars=hexdigits') | lower }}
    --from-literal=WEBUI_ADMIN_PASSWORD={{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}
  when: secret_exists.results[0].stdout == ''
  no_log: true

- name: 建立 es-mcp-cred（mcp_user 密碼）
  command: >-
    {{ kubectl_cmd }} -n {{ ai_namespace }} create secret generic es-mcp-cred
    --from-literal=password={{ lookup('password', '/dev/null length=24 chars=ascii_letters,digits') }}
  when: secret_exists.results[1].stdout == ''
  no_log: true
