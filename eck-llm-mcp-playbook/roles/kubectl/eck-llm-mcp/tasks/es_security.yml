---
# 在既有 ECK 的 ES 建唯讀角色 mcp_readonly 與帳號 mcp_user（規劃書 §6.2）。
# 用 ECK 的 elastic 超級使用者密碼操作；mcp_user 密碼來自 es-mcp-cred（secrets.yml 產生）。
- name: 讀取 elastic 密碼、mcp_user 密碼、ES ClusterIP
  command: "{{ kubectl_cmd }} {{ item.args }}"
  register: es_lookup
  changed_when: false
  no_log: "{{ item.secret }}"
  loop:
    - { secret: true,  args: "-n {{ eck_namespace }} get secret {{ es_admin_secret }} -o jsonpath={.data.elastic}" }
    - { secret: true,  args: "-n {{ ai_namespace }} get secret es-mcp-cred -o jsonpath={.data.password}" }
    - { secret: false, args: "-n {{ eck_namespace }} get svc {{ eck_es_name }}-es-http -o jsonpath={.spec.clusterIP}" }
  loop_control:
    label: "{{ item.args.split()[-1] }}"

- name: 整理連線資訊
  set_fact:
    es_admin_password: "{{ es_lookup.results[0].stdout | b64decode }}"
    mcp_user_password: "{{ es_lookup.results[1].stdout | b64decode }}"
    es_api_url: "https://{{ es_lookup.results[2].stdout }}:9200"
  no_log: true

- name: 建立/更新 mcp_readonly 角色
  uri:
    url: "{{ es_api_url }}/_security/role/mcp_readonly"
    method: PUT
    user: elastic
    password: "{{ es_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      cluster: ["monitor"]
      indices:
        - names: "{{ mcp_index_patterns }}"
          privileges: ["read", "view_index_metadata", "monitor"]
  register: es_role
  changed_when: es_role.json.role.created | default(false)
  no_log: true

- name: 建立/更新 mcp_user 帳號
  uri:
    url: "{{ es_api_url }}/_security/user/mcp_user"
    method: PUT
    user: elastic
    password: "{{ es_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      password: "{{ mcp_user_password }}"
      roles: ["mcp_readonly"]
      full_name: "MCP readonly"
  register: es_user
  changed_when: es_user.json.created | default(false)
  no_log: true
