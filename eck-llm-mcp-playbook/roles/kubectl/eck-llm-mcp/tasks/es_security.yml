---
# 建立 mcp_readonly 角色 + mcp_user 帳號（規劃書 §6.2）。
# ES 位址、elastic Secret 都由 preflight.yml 推導（es_resolved_*）；mcp_user_password 由 secrets.yml 提供。

- name: 讀取 elastic 超級使用者密碼（{{ es_resolved_namespace }}/{{ es_resolved_admin_secret }}）
  command: >-
    {{ kubectl_cmd }} -n {{ es_resolved_namespace }} get secret {{ es_resolved_admin_secret }}
    -o jsonpath={.data.{{ es_admin_secret_key }}}
  register: es_admin_secret_lookup
  changed_when: false
  failed_when: false
  no_log: true

- name: 找不到 elastic 密碼就中止並給清楚訊息
  assert:
    that: es_admin_secret_lookup.rc == 0 and es_admin_secret_lookup.stdout | length > 0
    quiet: true
    fail_msg: >-
      讀不到 Secret {{ es_resolved_namespace }}/{{ es_resolved_admin_secret }} 的 key
      "{{ es_admin_secret_key }}"。查法：kubectl -n {{ es_resolved_namespace }} get secret；
      ECK 預設是 <ES 名稱>-es-elastic-user，可用 es_admin_secret_name 覆寫。

- name: 解碼 elastic 密碼
  set_fact:
    es_admin_password: "{{ es_admin_secret_lookup.stdout | b64decode }}"
  no_log: true

- name: 確認可從此主機連到 ES（{{ es_resolved_api_url }}）
  uri:
    url: "{{ es_resolved_api_url }}/_cluster/health"
    user: elastic
    password: "{{ es_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
    timeout: 20
  register: es_health
  no_log: true
  failed_when: false

- name: ES 連不到就中止
  assert:
    that: es_health.status | default(0) == 200
    quiet: true
    fail_msg: >-
      連不到 {{ es_resolved_api_url }}/_cluster/health（HTTP {{ es_health.status | default('無回應') }}）。
      此位址由目標主機發起：ClusterIP 需要 kube-proxy 可達；不可達時把 es_api_url 設成
      ES 的 LoadBalancer VIP 或 NodePort，例如 https://10.0.0.60:9200。

- name: 建立/更新 {{ mcp_role_name }} 唯讀角色
  uri:
    url: "{{ es_resolved_api_url }}/_security/role/{{ mcp_role_name }}"
    method: PUT
    user: elastic
    password: "{{ es_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      cluster: ["monitor"]
      indices:
        - names: "{{ mcp_index_patterns }}"
          privileges: ["read", "view_index_metadata", "monitor"]
    status_code: [200, 201]
  no_log: true

- name: 建立/更新 {{ mcp_user_name }} 帳號
  uri:
    url: "{{ es_resolved_api_url }}/_security/user/{{ mcp_user_name }}"
    method: PUT
    user: elastic
    password: "{{ es_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      password: "{{ mcp_user_password }}"
      roles: ["{{ mcp_role_name }}"]
      full_name: "MCP readonly"
    status_code: [200, 201]
  no_log: true
