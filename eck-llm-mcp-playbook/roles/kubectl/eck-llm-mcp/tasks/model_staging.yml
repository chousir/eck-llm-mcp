---
# .ollama_staging/ 底下就是 Ollama 的 ~/.ollama/models 內容本身（blobs/ + manifests/），
# 而 PV ollama-models 掛在容器的 /root/.ollama，所以正確落地路徑是
# {{ ollama_pv_path }}/models/，不是 {{ ollama_pv_path }}/ 本身。

- name: 檢查來源 staging 目錄內的模型 manifest 是否存在
  stat:
    path: "{{ ollama_staging_dir }}/manifests/registry.ollama.ai/library/{{ item.name }}/{{ item.tag }}"
  register: staging_manifest_stat
  loop:
    - { name: "{{ ollama_primary_model_name }}", tag: "{{ ollama_primary_model_tag }}" }
    - { name: "{{ ollama_embed_model_name }}", tag: "{{ ollama_embed_model_tag }}" }
  loop_control:
    label: "{{ item.name }}:{{ item.tag }}"

- name: 找不到任何一個模型的 manifest 就中止（避免匯入不完整的模型集）
  fail:
    msg: >
      找不到模型 manifest：
      {{ ollama_staging_dir }}/manifests/registry.ollama.ai/library/{{ item.item.name }}/{{ item.item.tag }}
      請確認 LLM_MCP/models/.ollama_staging/ 已在此主機上備妥。
  loop: "{{ staging_manifest_stat.results }}"
  loop_control:
    label: "{{ item.item.name }}:{{ item.item.tag }}"
  when: not item.stat.exists

- name: 檢查目的地（PV）是否已匯入主力模型（idempotent 判斷依據）
  stat:
    path: "{{ ollama_pv_path }}/models/manifests/registry.ollama.ai/library/{{ ollama_primary_model_name }}/{{ ollama_primary_model_tag }}"
  register: dest_manifest_stat

- name: rsync 模型 blob 從 staging 匯入 PV（僅在尚未匯入時執行，資料量大避免重複複製）
  command: >
    rsync -a {{ ollama_staging_dir }}/ {{ ollama_pv_path }}/models/
  when: not dest_manifest_stat.stat.exists

- name: 確保模型檔案 owner 為 root（容器內 Ollama 以 root 執行）
  file:
    path: "{{ ollama_pv_path }}/models"
    state: directory
    recurse: true
    owner: root
    group: root
  when: not dest_manifest_stat.stat.exists
