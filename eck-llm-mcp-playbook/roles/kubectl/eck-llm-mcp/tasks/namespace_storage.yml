---
# PV directories + namespace / local PVs / PVCs
- name: 建立本地 PV 目錄與 manifest 目錄
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: ["{{ ollama_pv_path }}", "{{ openwebui_pv_path }}", "{{ manifest_dir }}"]

- name: Render namespace-and-local-pv.yaml
  template:
    src: namespace-and-local-pv.yaml.j2
    dest: "{{ manifest_dir }}/namespace-and-local-pv.yaml"
    mode: "0644"

- name: Apply namespace-and-local-pv.yaml（namespace + PV/PVC）
  command: "kubectl apply -f {{ manifest_dir }}/namespace-and-local-pv.yaml"
  register: apply_result
  changed_when: apply_result.stdout is search('created|configured')
