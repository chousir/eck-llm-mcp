---
# The order matters, do not rearrange: prereqs -> models -> secrets -> es_security -> deploy -> verify
# tags: models (import models only), verify (verification only). Do not use --tags on the first deployment.
- import_tasks: prereqs.yml

- import_tasks: models.yml
  tags: [models]

- import_tasks: secrets.yml

- import_tasks: es_security.yml

- import_tasks: deploy.yml

- import_tasks: verify.yml
  tags: [verify]
