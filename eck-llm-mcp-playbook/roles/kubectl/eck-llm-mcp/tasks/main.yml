---
# 執行順序有依賴關係，勿調整：
# node_prep -> prereqs(namespace/PV) -> model_staging -> secrets -> es_security
# -> ollama/es-mcp/open-webui -> webui_info
# secrets 必須在 es_security 之前，因為 es_security 要用 secrets.yml 產生/讀回的 mcp_user_password；
# secrets 也必須在 es-mcp/open-webui 部署之前，兩者的 Deployment 都靠 secretKeyRef 讀密碼。

- name: 節點標籤與本地 PV 目錄
  import_tasks: node_prep.yml

- name: 建立/更新 namespace 與本地 PV/PVC
  import_tasks: apply_manifest.yml
  vars:
    manifest: { name: prereqs, template: prereqs.yaml.j2 }

- name: 匯入 Ollama 模型 blob（staging -> PV）
  import_tasks: model_staging.yml

- name: 產生/讀回 Secret（WEBUI_SECRET_KEY、mcp_user 密碼）
  import_tasks: secrets.yml

- name: 建立 ES 唯讀角色與帳號
  import_tasks: es_security.yml
  tags: [es_security]

- name: 部署 Ollama / es-mcp / Open WebUI
  include_tasks: apply_manifest.yml
  loop:
    - { name: ollama,      template: ollama.yaml.j2,      deployment: ollama }
    - { name: es-mcp,      template: es-mcp.yaml.j2,      deployment: es-mcp }
    - { name: open-webui,  template: open-webui.yaml.j2,  deployment: open-webui }
  loop_control:
    loop_var: manifest
    label: "{{ manifest.name }}"

- name: 顯示 Open WebUI 存取資訊
  import_tasks: webui_info.yml
