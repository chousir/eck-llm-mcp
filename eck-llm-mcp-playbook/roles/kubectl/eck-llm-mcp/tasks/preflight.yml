---
# 每次都跑（tags: always）。只讀取、不改任何東西；把後續步驟需要的值解析成 *_resolved 事實。

# ---------------------------------------------------------------------
# kubectl / kubeconfig
# ---------------------------------------------------------------------
- name: Preflight - kubectl 能否連上叢集
  command: "{{ kubectl_cmd }} version -o json --request-timeout=15s"
  register: pf_kubectl
  changed_when: false
  failed_when: false

- name: Preflight - kubectl 檢查結果
  assert:
    that: pf_kubectl.rc == 0
    quiet: true
    fail_msg: |
      無法以 root 執行「{{ kubectl_cmd }}」連上叢集：
      {{ pf_kubectl.stderr | default(pf_kubectl.msg | default('')) }}
      請確認：
        1. root 的 PATH 找得到 kubectl；找不到就把 kubectl_bin 設成絕對路徑（在目標主機執行 command -v kubectl）。
        2. kubectl_kubeconfig 路徑正確（kubeadm: /etc/kubernetes/admin.conf、k3s: /etc/rancher/k3s/k3s.yaml、rke2: /etc/rancher/rke2/rke2.yaml）。

# ---------------------------------------------------------------------
# 目標節點 = ansible 目標主機
# ---------------------------------------------------------------------
- name: Preflight - 讀取節點 {{ ai_node_name }}
  command: "{{ kubectl_cmd }} get node {{ ai_node_name }} -o json"
  register: pf_node
  changed_when: false
  failed_when: false

- name: Preflight - 列出所有節點（僅在找不到指定節點時用於錯誤訊息）
  command: "{{ kubectl_cmd }} get nodes -o wide"
  register: pf_nodes_list
  changed_when: false
  failed_when: false
  when: pf_node.rc != 0

- name: Preflight - 節點必須存在
  assert:
    that: pf_node.rc == 0
    quiet: true
    fail_msg: |
      叢集內找不到節點「{{ ai_node_name }}」。請把 ai_node_name 改成下列 NAME 之一（且必須是 ansible 目標主機那台）：
      {{ pf_nodes_list.stdout | default('') }}

- name: Preflight - 解析節點資訊
  set_fact:
    ai_node_ips: >-
      {{ (pf_node.stdout | from_json).status.addresses
         | selectattr('type', 'equalto', 'InternalIP') | map(attribute='address') | list }}
    # PV nodeAffinity 用 kubernetes.io/hostname 標籤比對，它不一定等於節點名稱
    ai_node_hostname_label: >-
      {{ (pf_node.stdout | from_json).metadata.labels['kubernetes.io/hostname'] | default(ai_node_name) }}

- name: Preflight - ansible 目標主機必須就是節點 {{ ai_node_name }}
  assert:
    that: ai_node_ips | intersect(ansible_all_ipv4_addresses | default([]) + ansible_all_ipv6_addresses | default([])) | length > 0
    quiet: true
    fail_msg: |
      節點 {{ ai_node_name }} 的 InternalIP {{ ai_node_ips }} 不在目前 ansible 目標主機（{{ inventory_hostname }}）的 IP 清單內
      {{ ansible_all_ipv4_addresses | default([]) }}。
      本地 PV 目錄與模型會寫在 ansible 目標主機上，所以兩者必須是同一台：
      修改 inventory/hosts 的 ansible_host，或修改 ai_node_name。

# ---------------------------------------------------------------------
# 既有 ECK Elasticsearch：偵測 / 驗證，並推導連線資訊
# ---------------------------------------------------------------------
- name: Preflight - 列出叢集內的 Elasticsearch 資源（ECK）
  command: "{{ kubectl_cmd }} get elasticsearch -A -o json"
  register: pf_es_list
  changed_when: false
  failed_when: false

- name: Preflight - ECK CRD 必須存在
  assert:
    that: pf_es_list.rc == 0
    quiet: true
    fail_msg: |
      無法列出 Elasticsearch 資源（ECK operator 未安裝，或 kubeconfig 權限不足）：
      {{ pf_es_list.stderr }}

- name: Preflight - 依 eck_es_name / eck_namespace 篩選
  vars:
    pf_es_items: "{{ (pf_es_list.stdout | from_json)['items'] }}"
  set_fact:
    pf_es_all: "{% for i in pf_es_items %}{{ i.metadata.namespace }}/{{ i.metadata.name }}{{ '' if loop.last else ', ' }}{% endfor %}"
    pf_es_candidates: >-
      {{ pf_es_items
         | selectattr('metadata.name', 'in', [eck_es_name] if eck_es_name | length > 0 else pf_es_items | map(attribute='metadata.name') | list)
         | selectattr('metadata.namespace', 'in', [eck_namespace] if eck_namespace | length > 0 else pf_es_items | map(attribute='metadata.namespace') | list)
         | list }}

- name: Preflight - 必須恰好對到一個 Elasticsearch
  assert:
    that: pf_es_candidates | length == 1
    quiet: true
    fail_msg: |
      {% if pf_es_all | length == 0 %}
      叢集內沒有任何 Elasticsearch 資源，請先完成 ECK 部署。
      {% else %}
      依 eck_es_name="{{ eck_es_name }}"、eck_namespace="{{ eck_namespace }}" 對到 {{ pf_es_candidates | length }} 個 Elasticsearch。
      叢集內現有（namespace/name）：{{ pf_es_all }}
      請在 inventory/group_vars/all.yml 設定 eck_es_name 與 eck_namespace。
      {% endif %}

- name: Preflight - 推導 ES 相關值
  vars:
    es_obj: "{{ pf_es_candidates[0] }}"
  set_fact:
    es_resolved_name: "{{ es_obj.metadata.name }}"
    es_resolved_namespace: "{{ es_obj.metadata.namespace }}"
    es_resolved_health: "{{ es_obj.status.health | default('unknown') }}"
    es_resolved_version: "{{ es_obj.spec.version | default('?') }}"
    es_resolved_scheme: "{{ 'http' if (es_obj.spec.http.tls.selfSignedCertificate.disabled | default(false) | bool) else 'https' }}"

- name: Preflight - 推導 es-mcp ES_URL 與 elastic Secret 名稱
  set_fact:
    es_resolved_mcp_url: >-
      {{ es_mcp_es_url if es_mcp_es_url | length > 0
         else es_resolved_scheme ~ '://' ~ es_resolved_name ~ '-es-http.' ~ es_resolved_namespace ~ '.svc:9200' }}
    es_resolved_admin_secret: >-
      {{ es_admin_secret_name if es_admin_secret_name | length > 0 else es_resolved_name ~ '-es-elastic-user' }}

- name: Preflight - 讀取 {{ es_resolved_name }}-es-http 的 ClusterIP（目標主機打 ES API 用）
  command: "{{ kubectl_cmd }} -n {{ es_resolved_namespace }} get svc {{ es_resolved_name }}-es-http -o jsonpath={.spec.clusterIP}"
  register: pf_es_svc
  changed_when: false
  failed_when: false
  when: es_api_url | length == 0

- name: Preflight - 推導 ES API 位址
  set_fact:
    es_resolved_api_url: >-
      {%- if es_api_url | length > 0 -%}
      {{ es_api_url }}
      {%- elif pf_es_svc.rc == 0 and pf_es_svc.stdout not in ['', 'None'] -%}
      {{ es_resolved_scheme }}://{{ ('[' ~ pf_es_svc.stdout ~ ']') if ':' in pf_es_svc.stdout else pf_es_svc.stdout }}:9200
      {%- else -%}
      {%- endif -%}

- name: Preflight - ES API 位址必須可推導
  assert:
    that: es_resolved_api_url | length > 0
    quiet: true
    fail_msg: |
      讀不到 Service {{ es_resolved_namespace }}/{{ es_resolved_name }}-es-http 的 ClusterIP：{{ pf_es_svc.stderr | default('') }}
      請手動設定 es_api_url（例如 ES 的 LoadBalancer VIP：https://10.0.0.60:9200）。

- name: Preflight - ES 健康狀態不是 green/yellow 時提醒（不中止）
  debug:
    msg: >-
      注意：Elasticsearch {{ es_resolved_namespace }}/{{ es_resolved_name }} 目前 health={{ es_resolved_health }}。
      建立唯讀帳號與查詢仍可能成功，但請確認 ECK 叢集狀態。
  when: es_resolved_health not in ['green', 'yellow']

- name: Preflight - 解析結果
  debug:
    msg:
      - "AI 節點           : {{ ai_node_name }}（hostname 標籤 {{ ai_node_hostname_label }}，IP {{ ai_node_ips | join(', ') }}）"
      - "Elasticsearch     : {{ es_resolved_namespace }}/{{ es_resolved_name }}（v{{ es_resolved_version }}，health={{ es_resolved_health }}）"
      - "es-mcp ES_URL     : {{ es_resolved_mcp_url }}"
      - "ES API（主機端）  : {{ es_resolved_api_url }}"
      - "elastic Secret    : {{ es_resolved_namespace }}/{{ es_resolved_admin_secret }}"
