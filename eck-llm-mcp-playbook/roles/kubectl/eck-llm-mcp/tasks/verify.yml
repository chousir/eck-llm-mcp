---
# Everything runs inside the open-webui pod (the image ships curl / jq / sh); see templates/verify-smoke-test.sh.j2.
- name: 執行連線驗證
  command: "kubectl -n {{ ai_namespace }} exec -i deploy/open-webui -c open-webui -- sh -s"
  args:
    stdin: "{{ lookup('template', 'verify-smoke-test.sh.j2') }}"
  register: smoke
  changed_when: false
  failed_when: false
  async: 1200        # first load of the 35B model on CPU takes several minutes
  poll: 5

- name: 驗證結果
  debug:
    msg: "{{ (smoke.stdout | default('')).split('\n') + (smoke.stderr | default('')).split('\n') }}"

- name: 驗證有失敗就中止
  assert:
    that: smoke.rc | default(1) == 0
    quiet: true
    fail_msg: 連線驗證有項目失敗，請看上方輸出（[FAIL] 行）。

- name: 讀取 Open WebUI 位址
  command: "kubectl -n {{ ai_namespace }} get svc open-webui -o jsonpath={.status.loadBalancer.ingress[0].ip}"
  register: webui_ip
  changed_when: false

- name: 存取資訊
  debug:
    msg:
      - "Open WebUI : https://{{ webui_ip.stdout }}（憑證由 {{ cert_issuer_name }} 簽發，瀏覽器需信任該 CA）"
      - "admin 帳號 : admin@example.com"
      - "admin 密碼 : kubectl -n {{ ai_namespace }} get secret open-webui-secret -o jsonpath={.data.WEBUI_ADMIN_PASSWORD} | base64 -d"
      - "開放註冊已自動關閉；其他使用者請到 Admin -> Users 建立（角色選 user）。對話時模型選「{{ assistant_model_name }}」；若 Elasticsearch 工具沒有自動啟用，在輸入框 Tools 勾選。"
