---
# 泛用步驟：render 一份 k8s manifest 樣板 -> kubectl apply -> (可選) 等待 rollout。
# 由 tasks/main.yml 用 import_tasks/include_tasks 呼叫，透過變數 `manifest` 傳入：
#   manifest.name        manifest 檔名（不含副檔名），也是 rendered 檔案名稱
#   manifest.template    templates/ 內的樣板檔名
#   manifest.deployment  (選填) 要等待 rollout 完成的 Deployment 名稱

- name: "Render {{ manifest.name }}.yaml"
  template:
    src: "{{ manifest.template }}"
    dest: "{{ manifest_dir }}/{{ manifest.name }}.yaml"
    mode: "0644"

- name: "kubectl apply {{ manifest.name }}.yaml"
  command: kubectl apply -f {{ manifest_dir }}/{{ manifest.name }}.yaml
  environment:
    KUBECONFIG: "{{ kubectl_kubeconfig }}"
  register: manifest_apply
  changed_when: manifest_apply.stdout is search('(created|configured)')

- name: "等待 {{ manifest.deployment | default('deployment') }} rollout 完成"
  command: kubectl -n {{ ai_namespace }} rollout status deploy/{{ manifest.deployment }} --timeout=300s
  environment:
    KUBECONFIG: "{{ kubectl_kubeconfig }}"
  changed_when: false
  when: manifest.deployment is defined
