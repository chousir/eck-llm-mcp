---
- name: 讀取 Open WebUI Service
  command: "{{ kubectl_cmd }} -n {{ ai_namespace }} get svc open-webui -o json"
  register: webui_svc_raw
  changed_when: false
  until: >-
    open_webui_service_type != 'LoadBalancer'
    or (webui_svc_raw.stdout | from_json).status.loadBalancer.ingress | default([]) | length > 0
  retries: 12
  delay: 5
  failed_when: false

- name: 解析存取位址
  vars:
    svc: "{{ webui_svc_raw.stdout | from_json }}"
    lb: "{{ svc.status.loadBalancer.ingress | default([]) }}"
  set_fact:
    webui_url: >-
      {%- if open_webui_service_type == 'LoadBalancer' -%}
      {{ ('http://' ~ (lb[0].ip | default(lb[0].hostname | default('')))) if lb | length > 0
         else '(LoadBalancer IP 尚未配發：' ~ kubectl_cmd ~ ' -n ' ~ ai_namespace ~ ' get svc open-webui)' }}
      {%- elif open_webui_service_type == 'NodePort' -%}
      http://{{ ai_node_ips[0] }}:{{ svc.spec.ports[0].nodePort }}
      {%- else -%}
      （ClusterIP，請自行以 Ingress/port-forward 存取）
      {%- endif -%}
  when: webui_svc_raw.rc == 0

- name: 顯示 Open WebUI 存取資訊
  debug:
    msg:
      - "Open WebUI : {{ webui_url | default('(讀不到 Service)') }}"
      - "admin 帳號 : {{ webui_admin_email }}"
      - "admin 密碼 : {{ kubectl_cmd }} -n {{ ai_namespace }} get secret open-webui-secret -o jsonpath={.data.WEBUI_ADMIN_PASSWORD} | base64 -d"
      - "開放註冊已自動關閉；其他使用者請到 Admin -> Users 建立。"
      - "es-mcp 已預先註冊；對話時需在輸入框的 Tools 勾選 Elasticsearch。"
